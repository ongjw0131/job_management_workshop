name: job_management_workshop
description: "A Job Management Workshop Flutter Applications."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  supabase_flutter: ^2.10.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  mobile_scanner: ^7.0.1
  sqflite: ^2.4.2
  path: ^1.9.1
  image_picker: ^1.0.8
  path_provider: ^2.1.3
  signature: ^6.3.0
  connectivity_plus: ^7.0.0
  cached_network_image: ^3.4.1
  logger: ^2.0.2
  image: any
  pdf: ^3.10.1
  printing: ^5.11.0
  workmanager: ^0.9.0+3
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
